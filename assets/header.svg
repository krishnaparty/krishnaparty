<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="310" viewBox="0 0 960 310" role="img">
  <title>Krishna Gupta — Cloud, code, and thoughtful interfaces</title>

  <defs>
    <clipPath id="card"><rect width="960" height="310" rx="20"/></clipPath>
    <clipPath id="nameClip">
      <rect x="30" y="92" height="70" width="432">
        <animate attributeName="width" values="0;0;432" keyTimes="0;0.2;1" dur="2.4s" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1" fill="freeze"/>
      </rect>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#101a36"/>
    </linearGradient>

    <radialGradient id="orbTeal"><stop offset="0" stop-color="#5eead4" stop-opacity="0.24"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbBlue"><stop offset="0" stop-color="#5b7cff" stop-opacity="0.30"/><stop offset="1" stop-color="#5b7cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbViolet"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#22345c" stroke-width="1" stroke-opacity="0.45"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="960" height="310" fill="url(#gridFade)"/></mask>

    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="432" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8baaff"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#8baaff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="38" y1="0" x2="338" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#edf2ff"/>
      <stop offset="0.4" stop-color="#edf2ff"/>
      <stop offset="0.7" stop-color="#7ff5e0"/>
      <stop offset="1" stop-color="#edf2ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="tagGrad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="490" y2="0">
      <stop offset="0" stop-color="#8baaff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4a63"/>
      <stop offset="1" stop-color="#14213a"/>
    </linearGradient>
    <linearGradient id="midFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23356a"/>
      <stop offset="1" stop-color="#14213a"/>
    </linearGradient>

    <linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>

    <path id="orbit" d="M670 142 a130 46 0 1 0 260 0 a130 46 0 1 0 -260 0"/>
  </defs>

  <style>
    .orb1{animation:d1 11s ease-in-out infinite alternate}
    .orb2{animation:d2 13s ease-in-out infinite alternate}
    .orb3{animation:d3 9s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(-70px,40px)}}
    @keyframes d2{to{transform:translate(120px,-50px)}}
    @keyframes d3{to{transform:translate(90px,50px)}}

    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .pill{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .ring{animation:ring 2.4s ease-in-out infinite}
    @keyframes ring{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.9}}

    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}

    .drop{animation:drop .9s cubic-bezier(.2,.9,.3,1.2) both}
    @keyframes drop{from{opacity:0;transform:translateY(-50px)}to{opacity:1;transform:translateY(0)}}
    .bob{animation:bob 3.8s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}

    .p{opacity:0;animation:up linear infinite}
    @keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-330px);opacity:0}}
    .g{opacity:0;animation:upSoft linear infinite}
    @keyframes upSoft{0%{transform:translateY(0) rotate(0);opacity:0}20%{opacity:.35}80%{opacity:.25}100%{transform:translateY(-300px) rotate(18deg);opacity:0}}
    .tw{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}

    .glint{animation:glint 7s ease-in-out infinite}
    @keyframes glint{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1300px)}}

    .glowpulse{animation:gp 2.6s ease-in-out infinite}
    @keyframes gp{0%,100%{opacity:.25}50%{opacity:.95}}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
    }
  </style>

  <g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" clip-path="url(#card)">
    <!-- background -->
    <rect width="960" height="310" fill="url(#bg)"/>
    <rect width="960" height="310" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- drifting colour orbs -->
    <circle class="orb1" cx="800" cy="120" r="260" fill="url(#orbTeal)"/>
    <circle class="orb2" cx="80" cy="290" r="300" fill="url(#orbBlue)"/>
    <circle class="orb3" cx="440" cy="0" r="240" fill="url(#orbViolet)"/>

    <!-- twinkling stars -->
    <g fill="#cfe3ff">
      <circle class="tw" cx="560" cy="60" r="1.4" style="animation-delay:-.4s"/>
      <circle class="tw" cx="610" cy="210" r="1.2" style="animation-delay:-1.3s"/>
      <circle class="tw" cx="925" cy="70" r="1.5" style="animation-delay:-2.1s"/>
      <circle class="tw" cx="660" cy="280" r="1.2" style="animation-delay:-.9s"/>
      <circle class="tw" cx="905" cy="250" r="1.4" style="animation-delay:-1.7s"/>
      <circle class="tw" cx="500" cy="160" r="1.1" style="animation-delay:-2.6s"/>
      <circle class="tw" cx="40" cy="20" r="1.1" style="animation-delay:-.2s"/>
      <circle class="tw" cx="590" cy="120" r="1.3" style="animation-delay:-1.9s"/>
    </g>

    <!-- floating code glyphs -->
    <g fill="#5d7fa8" font-size="18" font-weight="700">
      <text class="g" x="450" y="300" style="animation-duration:14s;animation-delay:-2s">{ }</text>
      <text class="g" x="585" y="300" style="animation-duration:17s;animation-delay:-9s">;</text>
      <text class="g" x="905" y="300" style="animation-duration:15s;animation-delay:-5s">( )</text>
      <text class="g" x="520" y="300" style="animation-duration:19s;animation-delay:-12s">=&gt;</text>
      <text class="g" x="640" y="300" style="animation-duration:16s;animation-delay:-7s">&lt;/&gt;</text>
    </g>

    <!-- rising particles -->
    <g fill="#5eead4">
      <circle class="p" cx="70"  cy="305" r="2"   style="animation-duration:9s;animation-delay:-1s"/>
      <circle class="p" cx="150" cy="305" r="1.6" style="animation-duration:12s;animation-delay:-6s"/>
      <circle class="p" cx="235" cy="305" r="2.2" style="animation-duration:10s;animation-delay:-3s"/>
      <circle class="p" cx="320" cy="305" r="1.5" style="animation-duration:13s;animation-delay:-8s"/>
      <circle class="p" cx="410" cy="305" r="2"   style="animation-duration:8s;animation-delay:-4s"/>
      <circle class="p" cx="480" cy="305" r="1.7" style="animation-duration:11s;animation-delay:-9s"/>
      <circle class="p" cx="560" cy="305" r="2.3" style="animation-duration:9.5s;animation-delay:-2s"/>
      <circle class="p" cx="700" cy="305" r="1.8" style="animation-duration:12s;animation-delay:-7s"/>
      <circle class="p" cx="770" cy="305" r="2"   style="animation-duration:10s;animation-delay:-5s"/>
      <circle class="p" cx="850" cy="305" r="1.6" style="animation-duration:8.5s;animation-delay:-3.5s"/>
      <circle class="p" cx="920" cy="305" r="2.2" style="animation-duration:11.5s;animation-delay:-10s"/>
    </g>
    <g fill="#8baaff">
      <circle class="p" cx="110" cy="305" r="1.5" style="animation-duration:10s;animation-delay:-5s"/>
      <circle class="p" cx="270" cy="305" r="1.8" style="animation-duration:14s;animation-delay:-11s"/>
      <circle class="p" cx="520" cy="305" r="1.5" style="animation-duration:9s;animation-delay:-6.5s"/>
      <circle class="p" cx="640" cy="305" r="2"   style="animation-duration:13s;animation-delay:-1.5s"/>
      <circle class="p" cx="815" cy="305" r="1.7" style="animation-duration:10.5s;animation-delay:-8s"/>
      <circle class="p" cx="885" cy="305" r="1.5" style="animation-duration:12.5s;animation-delay:-4s"/>
    </g>

    <!-- top line + travelling spark -->
    <path d="M32 32 H928" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 32 H928" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 826" stroke-opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="70" to="-826" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- eyebrow -->
    <g class="rise" style="animation-delay:.1s">
      <circle class="pulse" cx="46" cy="71.5" r="3.6" fill="#5eead4"/>
      <text x="60" y="76" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.6">KRISHNAPARTY / DEVELOPER PROFILE</text>
    </g>

    <!-- name: wipe-in typing + moving colour sweep + cursor -->
    <g clip-path="url(#nameClip)">
      <text x="38" y="143" fill="url(#nameGrad)" font-size="49" font-weight="700" textLength="420" lengthAdjust="spacingAndGlyphs">Krishna Gupta</text>
    </g>
    <rect y="102" width="3" height="46" rx="1.5" fill="#5eead4">
      <animate attributeName="x" values="30;30;462" keyTimes="0;0.2;1" dur="2.4s" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text class="rise" x="40" y="183" fill="url(#tagGrad)" font-size="22" style="animation-delay:2.2s">Cloud, code, and thoughtful interfaces.</text>

    <!-- subline -->
    <text class="rise" x="40" y="223" fill="#9aaac6" font-size="13" style="animation-delay:2.5s">Frontend development  <tspan fill="#5eead4">/</tspan>  Cloud exploration  <tspan fill="#5eead4">/</tspan>  India</text>

    <!-- pills -->
    <g class="pill" style="animation-delay:2.8s">
      <rect x="40" y="250" width="96" height="30" rx="15" fill="#19273d"/>
      <rect class="ring" x="40" y="250" width="96" height="30" rx="15" fill="none" stroke="#5eead4" stroke-width="1.2"/>
      <circle class="pulse" cx="56" cy="265" r="3" fill="#5eead4"/>
      <text x="68" y="269" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1">BUILD</text>
    </g>
    <g class="pill" style="animation-delay:3.0s">
      <rect x="148" y="250" width="96" height="30" rx="15" fill="#19273d"/>
      <rect class="ring" x="148" y="250" width="96" height="30" rx="15" fill="none" stroke="#5eead4" stroke-width="1.2" style="animation-delay:-.8s"/>
      <circle class="pulse" cx="164" cy="265" r="3" fill="#8baaff" style="animation-delay:-.6s"/>
      <text x="176" y="269" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1">LEARN</text>
    </g>
    <g class="pill" style="animation-delay:3.2s">
      <rect x="256" y="250" width="114" height="30" rx="15" fill="#19273d"/>
      <rect class="ring" x="256" y="250" width="114" height="30" rx="15" fill="none" stroke="#5eead4" stroke-width="1.2" style="animation-delay:-1.6s"/>
      <circle class="pulse" cx="272" cy="265" r="3" fill="#a78bfa" style="animation-delay:-1.2s"/>
      <text x="284" y="269" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1">ITERATE</text>
    </g>

    <!-- ===== right side: floating cloud-stack ===== -->
    <g transform="rotate(-12 800 142)">
      <use xlink:href="#orbit" href="#orbit" fill="none" stroke="#42607e" stroke-width="1" stroke-dasharray="3 6" stroke-opacity="0.7"/>
    </g>

    <!-- bottom layer -->
    <g transform="translate(800 164)">
      <g class="drop" style="animation-delay:.3s">
        <g class="bob" style="animation-delay:-2.4s;animation-duration:4.4s">
          <path d="M-62 0 L0 30 L0 44 L-62 14Z" fill="#0e182b"/>
          <path d="M62 0 L0 30 L0 44 L62 14Z" fill="#0a1222"/>
          <path d="M-62 0 L0 -30 L62 0 L0 30Z" fill="#14213a" stroke="#42607e" stroke-width="1.5"/>
        </g>
      </g>
    </g>
    <!-- middle layer -->
    <g transform="translate(800 128)">
      <g class="drop" style="animation-delay:.6s">
        <g class="bob" style="animation-delay:-1.2s;animation-duration:3.8s">
          <path d="M-62 0 L0 30 L0 44 L-62 14Z" fill="#16264a"/>
          <path d="M62 0 L0 30 L0 44 L62 14Z" fill="#0f1a35"/>
          <path d="M-62 0 L0 -30 L62 0 L0 30Z" fill="url(#midFace)" stroke="#8baaff" stroke-width="1.5" stroke-opacity="0.8"/>
        </g>
      </g>
    </g>
    <!-- top layer -->
    <g transform="translate(800 92)">
      <g class="drop" style="animation-delay:.9s">
        <g class="bob" style="animation-duration:3.4s">
          <path class="glowpulse" d="M-62 0 L0 -30 L62 0 L0 30Z" fill="none" stroke="#5eead4" stroke-width="4" filter="url(#glow)"/>
          <path d="M-62 0 L0 30 L0 44 L-62 14Z" fill="#17405a"/>
          <path d="M62 0 L0 30 L0 44 L62 14Z" fill="#102a44"/>
          <path d="M-62 0 L0 -30 L62 0 L0 30Z" fill="url(#topFace)" stroke="#5eead4" stroke-width="1.8"/>
          <path d="M-22 0 L0 -11 L22 0 L0 11Z" fill="#5eead4" fill-opacity="0.18"/>
        </g>
      </g>
    </g>

    <!-- orbiting tech chips -->
    <g transform="rotate(-12 800 142)">
      <g>
        <animateMotion dur="14s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#orbit" href="#orbit"/></animateMotion>
        <g transform="rotate(12)">
          <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#0f1a30" stroke="#5eead4" stroke-opacity="0.8"/>
          <text y="4" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700">AWS</text>
        </g>
      </g>
      <g>
        <animateMotion dur="14s" repeatCount="indefinite" begin="-4.7s"><mpath xlink:href="#orbit" href="#orbit"/></animateMotion>
        <g transform="rotate(12)">
          <rect x="-28" y="-11" width="56" height="22" rx="11" fill="#0f1a30" stroke="#8baaff" stroke-opacity="0.8"/>
          <text y="4" text-anchor="middle" fill="#8baaff" font-size="11" font-weight="700">React</text>
        </g>
      </g>
      <g>
        <animateMotion dur="14s" repeatCount="indefinite" begin="-9.4s"><mpath xlink:href="#orbit" href="#orbit"/></animateMotion>
        <g transform="rotate(12)">
          <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#0f1a30" stroke="#a78bfa" stroke-opacity="0.8"/>
          <text y="4" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">FastAPI</text>
        </g>
      </g>
    </g>

    <!-- </> glyph with glow -->
    <g class="rise" style="animation-delay:1.4s">
      <text class="glowpulse" x="800" y="262" text-anchor="middle" fill="#5eead4" font-size="36" font-weight="700" filter="url(#glow)">&lt;/&gt;</text>
      <text x="800" y="262" text-anchor="middle" fill="#5eead4" font-size="36" font-weight="700">&lt;/&gt;</text>
    </g>

    <!-- glass glint sweeping across the card -->
    <g transform="skewX(-20)">
      <rect class="glint" x="0" y="-10" width="140" height="340" fill="url(#glintGrad)"/>
    </g>

    <!-- card border -->
    <rect x="0.5" y="0.5" width="959" height="309" rx="19.5" fill="none" stroke="#5eead4" stroke-opacity="0.12"/>
  </g>
</svg>
