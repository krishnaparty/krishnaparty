<svg xmlns="http://www.w3.org/2000/svg" width="960" height="225" viewBox="0 0 960 225" role="img"><title>Contribution streak</title><g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="225" rx="20" fill="#0b1120"/><text x="32" y="38" fill="#5eead4" font-size="17" font-weight="700">CONSISTENCY / CONTRIBUTION STREAK</text><rect x="32" y="62" width="288" height="110" rx="12" fill="#121c30"/><text x="50" y="110" fill="#8baaff" font-size="30" font-weight="700">1 day</text><text x="50" y="145" fill="#9aaac6" font-size="12" font-weight="400">Current streak</text><rect x="336" y="62" width="288" height="110" rx="12" fill="#121c30"/><text x="354" y="110" fill="#8baaff" font-size="30" font-weight="700">1 day</text><text x="354" y="145" fill="#9aaac6" font-size="12" font-weight="400">Longest in shown period</text><rect x="640" y="62" width="288" height="110" rx="12" fill="#121c30"/><text x="658" y="110" fill="#8baaff" font-size="30" font-weight="700">8 days</text><text x="658" y="145" fill="#9aaac6" font-size="12" font-weight="400">Active days in shown period</text><text x="32" y="203" fill="#9aaac6" font-size="12" font-weight="400">An unfinished day preserves yesterday’s streak. Window: 2025-10-19 to 2026-10-18</text></g></svg>
